<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple QR Code Generator</title>
    <style>
        /* Modern CSS Reset & Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #4c1d95; /* Deep purple background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Glassmorphism/Clean card UI */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd6fe;
            text-align: center;
        }

        h1 {
            color: #5b21b6; /* Rich purple heading */
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        p {
            color: #7c3aed; /* Medium purple text */
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* Input styling */
        .input-group {
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #ddd6fe;
            font-size: 1rem;
            color: #2e1065;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #6d28d9; /* Bright purple highlight on focus */
        }

        /* Live Display QR Container */
        .qr-display-box {
            background-color: #f5f3ff; /* Soft purple tint */
            border: 1px dashed #c084fc;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 240px;
        }

        /* Ensures the script-generated QR element fits well */
        #qrcode img, #qrcode canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
    <!-- Lightweight third-party script to draw the QR graphic natively -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="card">
        <h1>QR Code Generator</h1>
        <p>Type text or a link below to view your live QR code</p>
        
        <div class="input-group">
            <input 
                type="text" 
                id="qr-input" 
                placeholder="Type here..." 
                value="Hello World!"
            />
        </div>

        <!-- The live QR graphic is injected into this display block directly on the screen -->
        <div class="qr-display-box">
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        const qrInput = document.getElementById('qr-input');
        const qrContainer = document.getElementById('qrcode');

        // Function to clear and generate a fresh live code
        function generateLiveQR(text) {
            qrContainer.innerHTML = ''; // Keep screen clear of old fragments
            
            if (text.trim() === '') {
                return; // Leave empty if text is deleted
            }

            new QRCode(qrContainer, {
                text: text,
                width: 200,
                height: 200,
                colorDark: "#4c1d95", // Dark purple blocks
                colorLight: "#ffffff", // Crisp white background
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Initialize immediately with the default value
        generateLiveQR(qrInput.value);

        // Instantly re-render on the screen on every keystroke
        qrInput.addEventListener('input', (e) => {
            generateLiveQR(e.target.value);
        });
    </script>

</body>
</html>
